<svg width="400" height="533" viewBox="0 0 400 533" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask for transparent face cutout -->
    <mask id="face-cutout">
      <rect width="400" height="533" fill="white"/>
      <circle cx="200" cy="260" r="95" fill="black"/>
    </mask>
  </defs>

  <!-- Everything uses the mask -->
  <g mask="url(#face-cutout)">
    <!-- Full background -->
    <rect width="400" height="533" fill="#FFE5CC"/>

    <!-- Decorative sprinkles pattern on background -->
    <rect x="50" y="80" width="12" height="4" fill="#FFB6C1" rx="2" transform="rotate(25 56 82)"/>
    <rect x="340" y="120" width="12" height="4" fill="#87CEEB" rx="2" transform="rotate(-35 346 122)"/>
    <rect x="30" y="180" width="12" height="4" fill="#FFE066" rx="2" transform="rotate(15 36 182)"/>
    <rect x="360" y="200" width="12" height="4" fill="#C8E6C9" rx="2" transform="rotate(-20 366 202)"/>
    <rect x="70" y="430" width="12" height="4" fill="#FFB6C1" rx="2" transform="rotate(45 76 432)"/>
    <rect x="330" y="460" width="12" height="4" fill="#FFD700" rx="2" transform="rotate(-15 336 462)"/>

    <!-- Cupcake wrapper bottom -->
    <path d="M 80 380 L 320 380 L 300 500 L 100 500 Z"
          fill="#FFB6C1"
          stroke="#FF9BAB"
          stroke-width="4"/>

    <!-- Wrapper pleats -->
    <line x1="130" y1="380" x2="120" y2="500" stroke="#FF9BAB" stroke-width="3"/>
    <line x1="180" y1="380" x2="170" y2="500" stroke="#FF9BAB" stroke-width="3"/>
    <line x1="220" y1="380" x2="210" y2="500" stroke="#FF9BAB" stroke-width="3"/>
    <line x1="270" y1="380" x2="260" y2="500" stroke="#FF9BAB" stroke-width="3"/>

    <!-- Cupcake top (frosting) - going around the face cutout -->
    <!-- Left frosting mound -->
    <ellipse cx="100" cy="270" rx="70" ry="80" fill="#FFF" stroke="#FFE5CC" stroke-width="3"/>
    <circle cx="90" cy="260" r="25" fill="#FFE5CC" opacity="0.6"/>

    <!-- Right frosting mound -->
    <ellipse cx="300" cy="270" rx="70" ry="80" fill="#FFF" stroke="#FFE5CC" stroke-width="3"/>
    <circle cx="310" cy="260" r="25" fill="#FFE5CC" opacity="0.6"/>

    <!-- Top frosting swirl -->
    <ellipse cx="200" cy="100" rx="85" ry="60" fill="#FFF" stroke="#FFE5CC" stroke-width="3"/>
    <circle cx="180" cy="95" r="20" fill="#FFE5CC" opacity="0.5"/>
    <circle cx="220" cy="90" r="18" fill="#FFE5CC" opacity="0.5"/>

    <!-- Bottom frosting -->
    <ellipse cx="200" cy="390" rx="90" ry="45" fill="#FFF" stroke="#FFE5CC" stroke-width="3"/>

    <!-- Cherry on top -->
    <circle cx="200" cy="70" r="22" fill="#DC143C" stroke="#C41E3A" stroke-width="2"/>
    <circle cx="195" cy="65" r="8" fill="#FF6B6B" opacity="0.6"/>

    <!-- Stem -->
    <path d="M 200 48 Q 205 30, 210 15" stroke="#654321" stroke-width="3" fill="none"/>

    <!-- Sprinkles on frosting -->
    <rect x="160" y="110" width="10" height="4" fill="#FF1744" rx="2" transform="rotate(30 165 112)"/>
    <rect x="240" y="105" width="10" height="4" fill="#4CAF50" rx="2" transform="rotate(-25 245 107)"/>
    <rect x="120" y="280" width="10" height="4" fill="#2196F3" rx="2" transform="rotate(40 125 282)"/>
    <rect x="280" y="275" width="10" height="4" fill="#FFD700" rx="2" transform="rotate(-35 285 277)"/>

    <!-- Small decorative hearts around cutout -->
    <path d="M 290 190 Q 295 185, 300 190 Q 305 195, 300 200 Q 295 205, 290 200 Q 285 195, 290 190 Z"
          fill="#FFB6C1" stroke="#FF9BAB" stroke-width="2"/>
    <path d="M 110 320 Q 115 315, 120 320 Q 125 325, 120 330 Q 115 335, 110 330 Q 105 325, 110 320 Z"
          fill="#FFB6C1" stroke="#FF9BAB" stroke-width="2"/>
  </g>

  <!-- Cutout border on top -->
  <circle cx="200" cy="260" r="95" fill="none" stroke="#FFE5CC" stroke-width="4"/>
</svg>
