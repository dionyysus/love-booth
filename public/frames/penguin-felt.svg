<svg width="400" height="533" viewBox="0 0 400 533" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define the mask for the face cutout -->
  <defs>
    <mask id="face-cutout">
      <rect width="400" height="533" fill="white"/>
      <!-- Circular cutout at 50%, 45% with 18% radius -->
      <circle cx="200" cy="240" r="72" fill="black"/>
    </mask>

    <!-- Felt texture filter -->
    <filter id="felt">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
    </filter>
  </defs>

  <!-- Background with mask applied -->
  <g mask="url(#face-cutout)">
    <!-- Blue felt background -->
    <rect width="400" height="533" fill="#87CEEB" filter="url(#felt)"/>

    <!-- Decorative dashed stitching around border -->
    <rect x="10" y="10" width="380" height="513" fill="none" stroke="#4682B4" stroke-width="2" stroke-dasharray="8,4" rx="15"/>

    <!-- Top left penguin -->
    <g transform="translate(40, 50)">
      <!-- Body -->
      <ellipse cx="30" cy="40" rx="28" ry="35" fill="#2C2C2C" filter="url(#felt)"/>
      <!-- Belly -->
      <ellipse cx="30" cy="42" rx="18" ry="25" fill="#F5E6D3" filter="url(#felt)"/>
      <!-- Blush -->
      <circle cx="20" cy="38" r="4" fill="#FFB6C1" opacity="0.6"/>
      <circle cx="40" cy="38" r="4" fill="#FFB6C1" opacity="0.6"/>
      <!-- Eyes -->
      <circle cx="24" cy="32" r="2" fill="#1a1a1a"/>
      <circle cx="36" cy="32" r="2" fill="#1a1a1a"/>
      <!-- Beak -->
      <polygon points="30,36 27,40 33,40" fill="#FFB347"/>
      <!-- Feet -->
      <ellipse cx="22" cy="75" rx="6" ry="4" fill="#FFB347"/>
      <ellipse cx="38" cy="75" rx="6" ry="4" fill="#FFB347"/>
    </g>

    <!-- Bottom right penguin -->
    <g transform="translate(300, 400)">
      <!-- Body -->
      <ellipse cx="30" cy="40" rx="28" ry="35" fill="#2C2C2C" filter="url(#felt)"/>
      <!-- Belly -->
      <ellipse cx="30" cy="42" rx="18" ry="25" fill="#F5E6D3" filter="url(#felt)"/>
      <!-- Blush -->
      <circle cx="20" cy="38" r="4" fill="#FFB6C1" opacity="0.6"/>
      <circle cx="40" cy="38" r="4" fill="#FFB6C1" opacity="0.6"/>
      <!-- Eyes -->
      <circle cx="24" cy="32" r="2" fill="#1a1a1a"/>
      <circle cx="36" cy="32" r="2" fill="#1a1a1a"/>
      <!-- Beak -->
      <polygon points="30,36 27,40 33,40" fill="#FFB347"/>
      <!-- Feet -->
      <ellipse cx="22" cy="75" rx="6" ry="4" fill="#FFB347"/>
      <ellipse cx="38" cy="75" rx="6" ry="4" fill="#FFB347"/>
    </g>

    <!-- Small starfish top right -->
    <g transform="translate(320, 80)">
      <path d="M20 0L24 12L36 12L26 20L30 32L20 24L10 32L14 20L4 12L16 12Z" fill="#FFE87C" filter="url(#felt)"/>
      <circle cx="20" cy="16" r="1.5" fill="#1a1a1a"/>
      <path d="M17 20 Q20 18 23 20" stroke="#1a1a1a" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Small fish bottom left -->
    <g transform="translate(60, 450)">
      <ellipse cx="15" cy="10" rx="12" ry="8" fill="#FFB6C1" filter="url(#felt)"/>
      <polygon points="0,10 5,6 5,14" fill="#FFB6C1" filter="url(#felt)"/>
      <circle cx="20" cy="9" r="1.5" fill="#1a1a1a"/>
      <path d="M17 12 Q18 11 19 12" stroke="#1a1a1a" stroke-width="0.5" fill="none"/>
    </g>

    <!-- Decorative circles -->
    <circle cx="340" cy="240" r="8" fill="#FF9BAB" filter="url(#felt)"/>
    <circle cx="360" cy="260" r="6" fill="#FFE87C" filter="url(#felt)"/>
    <circle cx="50" cy="260" r="7" fill="#98D8C8" filter="url(#felt)"/>
  </g>

  <!-- Photo cutout border (drawn on top, not masked) -->
  <circle cx="200" cy="240" r="72" fill="none" stroke="#FFE87C" stroke-width="4"/>
</svg>
