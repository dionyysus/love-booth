<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" fill="none">
  <!-- Bottom cake decoration - left -->
  <g transform="translate(5, 180)">
    <!-- Cake base -->
    <rect x="0" y="30" width="50" height="25" rx="3" fill="#F7D8E8" stroke="#3D352A" stroke-width="2"/>
    <!-- Cake top layer -->
    <rect x="5" y="15" width="40" height="18" rx="3" fill="#F5F0E6" stroke="#3D352A" stroke-width="2"/>
    <!-- Frosting drips -->
    <path d="M5,15 Q8,20 10,15 Q15,22 20,15 Q25,20 30,15 Q35,22 40,15 Q42,20 45,15" fill="none" stroke="#A3A86B" stroke-width="2"/>
    <!-- Candle -->
    <rect x="22" y="5" width="6" height="12" fill="#A3A86B" stroke="#3D352A" stroke-width="1"/>
    <!-- Flame -->
    <ellipse cx="25" cy="3" rx="4" ry="5" fill="#F7D8E8"/>
  </g>

  <!-- Bottom cake decoration - right -->
  <g transform="translate(145, 185)">
    <!-- Cake base -->
    <rect x="0" y="25" width="45" height="22" rx="3" fill="#A3A86B" stroke="#3D352A" stroke-width="2"/>
    <!-- Cake top layer -->
    <rect x="5" y="12" width="35" height="16" rx="3" fill="#F5F0E6" stroke="#3D352A" stroke-width="2"/>
    <!-- Frosting drips -->
    <path d="M5,12 Q10,17 15,12 Q20,17 25,12 Q30,17 35,12 Q38,17 40,12" fill="none" stroke="#F7D8E8" stroke-width="2"/>
    <!-- Candle -->
    <rect x="18" y="2" width="5" height="11" fill="#F7D8E8" stroke="#3D352A" stroke-width="1"/>
    <!-- Flame -->
    <ellipse cx="20.5" cy="0" rx="3" ry="4" fill="#A3A86B"/>
  </g>

  <!-- Top decoration - small cake -->
  <g transform="translate(75, 5)">
    <rect x="0" y="20" width="50" height="20" rx="3" fill="#F7D8E8" stroke="#3D352A" stroke-width="2"/>
    <rect x="8" y="8" width="34" height="14" rx="3" fill="#F5F0E6" stroke="#3D352A" stroke-width="2"/>
    <!-- Candles -->
    <rect x="15" y="0" width="4" height="10" fill="#A3A86B" stroke="#3D352A" stroke-width="1"/>
    <rect x="31" y="0" width="4" height="10" fill="#A3A86B" stroke="#3D352A" stroke-width="1"/>
  </g>

  <!-- Confetti dots -->
  <circle cx="15" cy="100" r="4" fill="#A3A86B"/>
  <circle cx="185" cy="80" r="3" fill="#F7D8E8"/>
  <circle cx="10" cy="150" r="3" fill="#D6E5ED"/>
  <circle cx="190" cy="140" r="4" fill="#A3A86B"/>
</svg>
