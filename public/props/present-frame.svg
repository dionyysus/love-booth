<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper texture for gift wrap -->
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0.3"/>
    </filter>

    <!-- Polka dot pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="6" fill="#FFB6C1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Gift box main body with texture -->
  <rect x="80" y="200" width="240" height="280"
        fill="#C8E6C9"
        stroke="#8BC34A"
        stroke-width="3"
        rx="8"
        filter="url(#paper-grain)"
        opacity="0.95"/>

  <!-- Polka dots on gift wrap -->
  <rect x="80" y="200" width="240" height="280"
        fill="url(#dots)"
        rx="8"/>

  <!-- Vertical ribbon -->
  <rect x="180" y="180" width="40" height="320"
        fill="#FFD700"
        stroke="#FFB300"
        stroke-width="2"/>

  <!-- Ribbon shine/highlight -->
  <rect x="185" y="180" width="8" height="320"
        fill="#FFF"
        opacity="0.3"/>

  <!-- Horizontal ribbon -->
  <rect x="60" y="320" width="280" height="40"
        fill="#FFD700"
        stroke="#FFB300"
        stroke-width="2"/>

  <!-- Ribbon shine horizontal -->
  <rect x="60" y="325" width="280" height="8"
        fill="#FFF"
        opacity="0.3"/>

  <!-- Ribbon crossing detail -->
  <rect x="180" y="320" width="40" height="40"
        fill="#FFA000"
        stroke="#FFB300"
        stroke-width="2"/>

  <!-- Bow - left loop -->
  <ellipse cx="130" cy="170" rx="45" ry="35"
           fill="#FFD700"
           stroke="#FFB300"
           stroke-width="2"
           transform="rotate(-25 130 170)"/>

  <!-- Bow - right loop -->
  <ellipse cx="270" cy="170" rx="45" ry="35"
           fill="#FFD700"
           stroke="#FFB300"
           stroke-width="2"
           transform="rotate(25 270 170)"/>

  <!-- Bow center knot -->
  <circle cx="200" cy="170" r="25"
          fill="#FFA000"
          stroke="#FFB300"
          stroke-width="2"/>

  <!-- Bow knot highlight -->
  <circle cx="195" cy="165" r="8"
          fill="#FFF"
          opacity="0.5"/>

  <!-- Left ribbon tail -->
  <path d="M 110 180 Q 60 200, 50 240 L 65 245 Q 75 210, 120 190 Z"
        fill="#FFD700"
        stroke="#FFB300"
        stroke-width="2"/>

  <!-- Right ribbon tail -->
  <path d="M 290 180 Q 340 200, 350 240 L 335 245 Q 325 210, 280 190 Z"
        fill="#FFD700"
        stroke="#FFB300"
        stroke-width="2"/>

  <!-- Tape pieces on corners (like real wrapping) -->
  <rect x="75" y="195" width="15" height="8" fill="#FFF" opacity="0.6" rx="1"/>
  <rect x="310" y="195" width="15" height="8" fill="#FFF" opacity="0.6" rx="1"/>

  <!-- Gift tag hanging from bow -->
  <rect x="240" y="200" width="45" height="30"
        fill="#FFF9ED"
        stroke="#D4A574"
        stroke-width="2"
        rx="3"/>

  <!-- String for tag -->
  <line x1="250" y1="185" x2="250" y2="200"
        stroke="#D4A574"
        stroke-width="2"/>

  <!-- "TO:" text on tag -->
  <text x="247" y="218" font-family="Permanent Marker" font-size="12" fill="#4A3826">YOU</text>

  <!-- Box shadow for depth -->
  <rect x="85" y="475" width="230" height="10"
        fill="#000"
        opacity="0.15"
        rx="5"
        filter="blur(4px)"/>
</svg>
