<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Cupcake liner/wrapper with stitching texture -->
  <defs>
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
    <pattern id="stitch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="5" y2="10" stroke="#8B7355" stroke-width="1.5" stroke-dasharray="2,3"/>
    </pattern>
  </defs>

  <!-- Wrapper base (trapezoid shape) -->
  <path d="M 100 350 L 300 350 L 280 450 L 120 450 Z"
        fill="#FFE5CC"
        stroke="#D4A574"
        stroke-width="3"
        filter="url(#paper-texture)"
        opacity="0.9"/>

  <!-- Wrapper pleats/lines -->
  <line x1="140" y1="350" x2="135" y2="450" stroke="#D4A574" stroke-width="2"/>
  <line x1="180" y1="350" x2="170" y2="450" stroke="#D4A574" stroke-width="2"/>
  <line x1="220" y1="350" x2="210" y2="450" stroke="#D4A574" stroke-width="2"/>
  <line x1="260" y1="350" x2="250" y2="450" stroke="#D4A574" stroke-width="2"/>

  <!-- Stitching detail around edge -->
  <path d="M 100 350 L 300 350 L 280 450 L 120 450 Z"
        fill="none"
        stroke="url(#stitch)"
        stroke-width="2"/>

  <!-- Frosting top (wavy, textured) -->
  <path d="M 80 250 Q 100 230, 120 240 Q 140 250, 160 235 Q 180 220, 200 230 Q 220 240, 240 235 Q 260 230, 280 240 Q 300 250, 320 240 L 320 350 L 80 350 Z"
        fill="#FFB6C1"
        stroke="#FF9BAB"
        stroke-width="3"
        opacity="0.95"/>

  <!-- Frosting swirls/texture -->
  <circle cx="120" cy="280" r="15" fill="#FF9BAB" opacity="0.6"/>
  <circle cx="200" cy="270" r="18" fill="#FF9BAB" opacity="0.5"/>
  <circle cx="280" cy="285" r="14" fill="#FF9BAB" opacity="0.6"/>
  <circle cx="160" cy="310" r="12" fill="#FFF" opacity="0.4"/>
  <circle cx="240" cy="305" r="13" fill="#FFF" opacity="0.4"/>

  <!-- Cherry on top with highlight -->
  <ellipse cx="200" cy="220" rx="18" ry="22" fill="#DC143C"/>
  <ellipse cx="200" cy="215" rx="15" ry="18" fill="#FF1744"/>
  <circle cx="195" cy="210" r="5" fill="#FFB6C1" opacity="0.6"/>

  <!-- Stem -->
  <path d="M 200 200 Q 205 185, 210 170"
        stroke="#654321"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>

  <!-- Photo window (oval cutout in the middle) -->
  <ellipse cx="200" cy="350" rx="85" ry="100" fill="#FFF" opacity="0"/>

  <!-- Decorative sprinkles around -->
  <rect x="130" y="265" width="8" height="3" fill="#FFE066" rx="1" transform="rotate(25 134 266.5)"/>
  <rect x="180" y="255" width="8" height="3" fill="#87CEEB" rx="1" transform="rotate(-15 184 256.5)"/>
  <rect x="240" y="270" width="8" height="3" fill="#FFE066" rx="1" transform="rotate(45 244 271.5)"/>
  <rect x="260" y="295" width="8" height="3" fill="#FF69B4" rx="1" transform="rotate(-30 264 296.5)"/>
  <rect x="150" y="300" width="8" height="3" fill="#87CEEB" rx="1" transform="rotate(60 154 301.5)"/>
</svg>
